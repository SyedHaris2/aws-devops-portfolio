name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.6.0"

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      run: |
        terraform init -backend=false
        terraform validate

  test-infrastructure:
    name: Test Infrastructure Code
    runs-on: ubuntu-latest
    needs: validate-terraform

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.6.0"

    - name: Terraform Plan
      run: |
        terraform init -backend=false
        terraform plan -no-color -out=tfplan
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1

  test-microservices:
    name: Test Microservices
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [api-gateway, user-service, product-service]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: node-js-microservices/${{ matrix.service }}/package-lock.json

    - name: Install dependencies
      run: |
        cd node-js-microservices/${{ matrix.service }}
        npm ci

    - name: Run linting
      run: |
        cd node-js-microservices/${{ matrix.service }}
        npm run lint || echo "No lint script found"

    - name: Check syntax
      run: |
        cd node-js-microservices/${{ matrix.service }}
        node -c src/app.js

  docker-build-test:
    name: Test Docker Builds
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [api-gateway, user-service, product-service]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./node-js-microservices/${{ matrix.service }}
        file: ./node-js-microservices/${{ matrix.service }}/Dockerfile
        push: false
        tags: test-${{ matrix.service }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  kubernetes-validation:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Validate Kubernetes manifests
      run: |
        find k8s-manifests -name "*.yaml" -exec kubectl apply --dry-run=client --validate=true -f {} \;

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-preview:
    name: Deploy to Preview Environment
    runs-on: ubuntu-latest
    needs: [validate-terraform, test-microservices, docker-build-test, kubernetes-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: preview

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.6.0"

    - name: Terraform Plan for Preview
      run: |
        terraform init
        terraform workspace select preview || terraform workspace new preview
        terraform plan -no-color
      env:
        TF_VAR_environment: preview

    - name: Deploy to Preview (Optional)
      run: |
        echo "Preview deployment would happen here"
        echo "terraform apply -auto-approve"
      env:
        TF_VAR_environment: preview

  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [validate-terraform, test-microservices, docker-build-test, kubernetes-validation, security-scan]
    if: always()

    steps:
    - name: Notify success
      if: needs.validate-terraform.result == 'success' && needs.test-microservices.result == 'success' && needs.docker-build-test.result == 'success' && needs.kubernetes-validation.result == 'success'
      run: |
        echo "✅ All tests passed! Ready for deployment."

    - name: Notify failure
      if: failure()
      run: |
        echo "❌ Some tests failed. Please check the logs."
